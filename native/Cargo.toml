[package]
name = "r5-server-gui"
version = "2.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "R5Flowstate 服务端管理面板的原生宿主（solid-gpui）"

# 独立 workspace：solid-gpui 的 [patch.crates-io] 与 profile 只对 workspace 根生效，
# 这里必须把 vendored gpui 的替换重写一遍，否则会去 crates.io 取未打补丁的 gpui-pre。
[workspace]

[[bin]]
name = "r5-server-gui"
path = "src/main.rs"

[features]
embedded = ["solid-gpui/embedded-bun"]

[dependencies]
solid-gpui = { path = "../vendor/solid-gpui/crates/solid-gpui", features = ["gpui-component"] }
gpui-component = { path = "../vendor/solid-gpui/vendor/gpui-kit/crates/component" }
serde_json = "1"

[profile.dev]
debug = 1

# 与 vendor/solid-gpui/Cargo.toml 保持一致：布局与场景构建在 dev 下也要优化，
# 否则滚动与日志区的帧耗时会比发布版差一个数量级。
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package.slotmap]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
gpui-pre-reqwest-client = { path = "../vendor/solid-gpui/vendor/gpui-reqwest-client" }
gpui-pre = { path = "../vendor/solid-gpui/vendor/gpui" }
gpui-pre-web = { path = "../vendor/solid-gpui/vendor/gpui-web" }
gpui-pre-wgpu = { path = "../vendor/solid-gpui/vendor/gpui-wgpu" }
# 平台 crate 也必须替换：`gpui-pre-platform`（crates.io）按目标平台依赖
# `gpui-pre-windows` / `gpui-pre-macos` / `gpui-pre-linux`，submodule 的 [patch.crates-io] 三个都换成了
# 自己的副本。少一条不会报错，但会**静默地**用 crates.io 上那份**没有被 patch 过**的平台实现
# （macOS 上就是原生 anchored popup 没实现的老版本），与 pin 住的 submodule 不一致。
gpui-pre-windows = { path = "../vendor/solid-gpui/vendor/gpui-windows" }
gpui-pre-macos = { path = "../vendor/solid-gpui/vendor/gpui-macos" }
gpui-pre-linux = { path = "../vendor/solid-gpui/vendor/gpui-linux" }
