# Bun 包管理器配置：bun install / add / update / bunx 都读这里。
#
# 依赖策略：只装「发布满 24 小时」的版本。供应链投毒包一般在发布后几个小时内
# 被发现并撤回，而本面板跑在玩家的服务器上（能起进程、能提权），装到投毒版本
# 就是交出宿主机。24 小时的窗口让 npm 与社区先替我们踩雷。
#
# 除这条冷却期外，依赖一律取最新：升级跑 `bun update --latest`（会连同
# package.json 的 range 一起改到冷却期内最新的版本）。
[install]
minimumReleaseAge = 86400

# 工作区依赖必须爬到仓库根的 node_modules：vendor/solid-gpui 里的包按裸包名
# （vite、@tanstack/*、solid-js…）导入依赖，Node/Bun 只按目录向上查 node_modules，
# 嵌套安装在 desktop/node_modules 里的依赖它们永远看不到。
linker = "hoisted"
