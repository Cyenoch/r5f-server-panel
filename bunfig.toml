# Bun 包管理器配置：bun install / add / update / bunx 都读这里。
#
# 依赖策略：只装「发布满 24 小时」的版本。供应链投毒包一般在发布后几个小时内
# 被发现并撤回，而本面板跑在玩家的服务器上（能起进程、能提权），装到投毒版本
# 就是交出宿主机。24 小时的窗口让 npm 与社区先替我们踩雷。
#
# 除这条冷却期外，依赖一律取最新：升级跑 `bun update --latest`（会连同
# package.json 的 range 一起改到冷却期内最新的版本）。
#
# 这里不再写 `linker`：早先那条 hoisted 覆盖只为一件事 —— 让 vendor/solid-gpui 的
# **源码**通过祖先目录解析裸包名。现在应用与 Vite 配置一律走包 exports（SDK 走
# vendor/sdk-tarballs 里的 tarball，见该目录 provenance.json），覆盖失去依据。
[install]
minimumReleaseAge = 86400

# 测试只跑应用自己的那份：`solid-gpui test` 转发裸 `bun test`，而仓库根下面还挂着
# vendor/solid-gpui —— 那是 SDK 自己的测试套件（几十个文件、各要自己的依赖与预算）。
# 不设 root 时它会一起被收集，默认 `bun run test` 就变成"顺便测一遍整个 SDK"。
# 过滤器是同 `root` 相对的，所以单文件是 `bun run test state.test.ts`。
[test]
root = "src"
